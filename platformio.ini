; Pool Temperature Monitor - ESP32-C3 SuperMini
; The SuperMini has no dedicated PlatformIO board definition; the
; esp32-c3-devkitm-1 definition (4 MB flash) is the common stand-in.
;
; Each sketch lives in its own folder under src/ and has its own env.
; Pick the env with the selector in the bottom status bar (env:...).

[platformio]
default_envs = monitor

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Stamps FW_VERSION (git commit) into every build
extra_scripts = pre:scripts/version.py
build_flags =
    ; Route Serial over the C3's native USB (no USB-UART chip on the SuperMini)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Production firmware: read probes, publish JSON over MQTT, sleep
[env:monitor]
build_src_filter = +<monitor/>
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.1
    knolleary/PubSubClient@^2.8

; Same firmware as monitor, but Upload sends it to the Pi instead of USB; the
; ESP32 installs it on its next wake. Flash monitor over USB once first (it
; contains the OTA code), and test changes over USB before deploying them.
[env:ota]
extends = env:monitor
upload_protocol = custom
extra_scripts =
    pre:scripts/version.py
    scripts/ota_upload.py

; Reads all DS18B20 probes continuously, prints ROM addresses + temps
[env:probe_test]
build_src_filter = +<probe_test/>
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.1

; WiFi connect-time / RSSI test
[env:wifi_test]
build_src_filter = +<wifi_test/>

; Drives GPIO4/5/6/7 HIGH one at a time to confirm board labels with a meter
[env:pin_test]
build_src_filter = +<pin_test/>

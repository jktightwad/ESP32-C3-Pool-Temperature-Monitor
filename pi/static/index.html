<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Temperature</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series-1: #2a78d6;  /* surface */
    --series-2: #eb6834;  /* mid */
    --series-3: #1baf7a;  /* bottom */
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  h2 { font-size: 0.95rem; margin: 0 0 8px; color: var(--ink-2); font-weight: 600; }
  .status { color: var(--ink-2); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .tile .label { color: var(--ink-2); font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
  .tile .swatch { width: 12px; height: 3px; border-radius: 2px; }
  .tile .value { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .unit { font-size: 1rem; color: var(--ink-2); font-weight: 400; }
  .controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .controls button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { border-color: var(--ink-2); font-weight: 600; }
  .chart { position: relative; height: 300px; }
  .chart.small { height: 160px; }
  .stack { display: grid; gap: 12px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--ink-2); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8px; font-size: 0.9rem; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  .table-wrap { overflow-x: auto; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Pool Temperature</h1>
  <div class="status" id="status">Loading…</div>

  <div class="tiles">
    <div class="card tile"><div class="label"><span class="swatch" style="background:var(--series-1)"></span>Surface</div><div class="value" id="v-surface">–</div></div>
    <div class="card tile"><div class="label"><span class="swatch" style="background:var(--series-2)"></span>Mid</div><div class="value" id="v-mid">–</div></div>
    <div class="card tile"><div class="label"><span class="swatch" style="background:var(--series-3)"></span>Bottom</div><div class="value" id="v-bottom">–</div></div>
    <div class="card tile"><div class="label">Battery</div><div class="value" id="v-batt">–</div></div>
    <div class="card tile"><div class="label">WiFi signal</div><div class="value" id="v-rssi">–</div></div>
  </div>

  <div class="controls" role="group" aria-label="Time range">
    <button data-hours="24" aria-pressed="true">24 h</button>
    <button data-hours="168" aria-pressed="false">7 days</button>
    <button data-hours="720" aria-pressed="false">30 days</button>
  </div>

  <div class="stack">
    <div class="card">
      <h2>Water temperature (°F)</h2>
      <div class="chart"><canvas id="tempChart" aria-label="Water temperature over time by depth"></canvas></div>
    </div>
    <div class="card">
      <h2>Battery (V)</h2>
      <div class="chart small"><canvas id="battChart" aria-label="Battery voltage over time"></canvas></div>
    </div>
    <div class="card">
      <h2>WiFi signal (dBm)</h2>
      <div class="chart small"><canvas id="rssiChart" aria-label="WiFi signal strength over time"></canvas></div>
    </div>
  </div>

  <details>
    <summary>Table view</summary>
    <div class="table-wrap"><table id="table"></table></div>
  </details>
</main>

<!-- Chart.js 4.4.1 (MIT), bundled so the page works without internet -->
<script src="/static/chart.umd.js"></script>
<script>
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let hours = 24;
let tempChart, battChart, rssiChart;

// Tick labels: time of day for 24 h, date for longer ranges.
const fmtTick = ms => {
  const d = new Date(ms);
  return hours <= 24 ? d.toLocaleTimeString([], { hour: "numeric" })
                     : d.toLocaleDateString([], { month: "short", day: "numeric" });
};
const fmtTime = ms => {
  const d = new Date(ms);
  return hours <= 24
    ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " +
      d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
};
const fmtAge = s => s < 90 ? `${s} s` : s < 5400 ? `${Math.round(s / 60)} min` :
  s < 172800 ? `${Math.round(s / 3600)} h` : `${Math.round(s / 86400)} days`;

// Points as {x: ms, y}, with a null inserted wherever readings stop for longer
// than gap_s so the line breaks instead of bridging missing data.
function series(rows, key, gapS) {
  const pts = [];
  rows.forEach((r, i) => {
    if (i > 0 && r.ts - rows[i - 1].ts > gapS) pts.push({ x: (rows[i - 1].ts + 1) * 1000, y: null });
    pts.push({ x: r.ts * 1000, y: r[key] });
  });
  return pts;
}

// Ticks on whole local hours/days: every 4 h for 24 h, daily for 7 days,
// every 5 days for 30 days.
function timeTicks(axis) {
  const H = 3600e3, D = 24 * H;
  const step = hours <= 24 ? 4 * H : hours <= 168 ? D : 5 * D;
  const t = new Date(axis.min);
  t.setMinutes(0, 0, 0);
  if (step >= D) t.setHours(0); else t.setHours(Math.ceil(t.getHours() / 4) * 4);
  const ticks = [];
  for (let v = t.getTime(); v <= axis.max; v += step) if (v >= axis.min) ticks.push({ value: v });
  axis.ticks = ticks;
}

function baseOptions(yTitle) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    layout: { padding: { right: 6 } },  // room for the latest-reading dot
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { labels: { color: css("--ink-2"), boxWidth: 12, boxHeight: 3 } },
      tooltip: { callbacks: { title: items => items.length ? fmtTime(items[0].parsed.x) : "" } },
    },
    scales: {
      x: { type: "linear", afterBuildTicks: timeTicks,
           ticks: { color: css("--muted"), maxRotation: 0, autoSkip: true, callback: v => fmtTick(v) },
           grid: { color: css("--grid") }, border: { color: css("--axis") } },
      y: { ticks: { color: css("--muted") }, grid: { color: css("--grid") }, border: { color: css("--axis") },
           title: { display: false, text: yTitle } },
    },
  };
}

// Lines draw no dots, except the latest reading and any isolated reading
// (no neighbour on either side), which would otherwise be invisible: e.g. a
// few readings 30 s apart on a 24 h axis are narrower than a pixel.
function dotRadius(ctx) {
  const d = ctx.dataset.data, i = ctx.dataIndex;
  if (d[i] == null || d[i].y == null) return 0;
  const has = j => j >= 0 && j < d.length && d[j].y != null;
  return (i === d.length - 1 || (!has(i - 1) && !has(i + 1))) ? 3 : 0;
}

function line(label, data, color) {
  return { label, data, borderColor: color, backgroundColor: color, borderWidth: 2,
           pointRadius: dotRadius, pointHoverRadius: 4, spanGaps: false, tension: 0,
           clip: false };  // don't cut the latest dot in half at the right edge
}

function draw(data) {
  const rows = data.rows, gap = data.gap_s;
  // Always show the whole selected range, ending now.
  const xMax = Date.now(), xMin = xMax - hours * 3600e3;
  const temp = [
    line("Surface", series(rows, "surface_f", gap), css("--series-1")),
    line("Mid", series(rows, "mid_f", gap), css("--series-2")),
    line("Bottom", series(rows, "bottom_f", gap), css("--series-3")),
  ];
  const batt = [line("Battery", series(rows, "battery_v", gap), css("--ink-2"))];
  const rssi = [line("RSSI", series(rows, "rssi", gap), css("--ink-2"))];

  if (!tempChart) {
    tempChart = new Chart(document.getElementById("tempChart"), { type: "line", data: { datasets: temp }, options: baseOptions("°F") });
    // Single-series charts: the card title names the series, so no legend.
    const bo = baseOptions("V");
    bo.plugins.legend.display = false;
    battChart = new Chart(document.getElementById("battChart"), { type: "line", data: { datasets: batt }, options: bo });
    const ro = baseOptions("dBm");
    ro.plugins.legend.display = false;
    rssiChart = new Chart(document.getElementById("rssiChart"), { type: "line", data: { datasets: rssi }, options: ro });
  } else {
    tempChart.data.datasets = temp;
    battChart.data.datasets = batt;
    rssiChart.data.datasets = rssi;
  }
  for (const c of [tempChart, battChart, rssiChart]) {
    c.options.scales.x.min = xMin;
    c.options.scales.x.max = xMax;
    c.update();
  }

  const fmt = v => v == null ? "–" : v.toFixed(1);
  const recent = rows.slice(-100).reverse();
  document.getElementById("table").innerHTML =
    "<tr><th>Time</th><th>Surface °F</th><th>Mid °F</th><th>Bottom °F</th><th>Battery V</th><th>RSSI</th><th>Access point</th><th>Boot</th><th>Reset</th><th>Firmware</th></tr>" +
    (recent.length ? recent.map(r => `<tr><td>${new Date(r.ts * 1000).toLocaleString()}</td><td>${fmt(r.surface_f)}</td>` +
      `<td>${fmt(r.mid_f)}</td><td>${fmt(r.bottom_f)}</td>` +
      `<td>${r.battery_v == null ? "–" : r.battery_v.toFixed(2)}</td><td>${r.rssi ?? "–"}</td><td>${r.bssid ?? "–"}</td><td>${r.boot ?? "–"}</td><td>${r.reset ?? "–"}</td><td>${r.fw ?? "–"}</td></tr>`).join("")
      : `<tr><td colspan="10" class="empty">No readings in this range</td></tr>`);
}

function showLatest(r) {
  const status = document.getElementById("status");
  if (!r) { status.textContent = "No readings yet"; return; }
  const t = v => v == null ? "–" : `${v.toFixed(1)}<span class="unit"> °F</span>`;
  document.getElementById("v-surface").innerHTML = t(r.surface_f);
  document.getElementById("v-mid").innerHTML = t(r.mid_f);
  document.getElementById("v-bottom").innerHTML = t(r.bottom_f);
  document.getElementById("v-batt").innerHTML = r.battery_v == null ? "–" : `${r.battery_v.toFixed(2)}<span class="unit"> V</span>`;
  document.getElementById("v-rssi").innerHTML = r.rssi ? `${r.rssi}<span class="unit"> dBm</span>` : "–";

  // Worst condition decides the colour; every problem is listed.
  const missing = ["surface_f", "mid_f", "bottom_f"].filter(k => r[k] == null).length;
  const b = r.battery_v;
  let level = 0;  // 0 good, 1 warning, 2 critical
  const notes = [];
  if (b != null && b < r.batt_low_v) { level = 2; notes.push(`battery low (${b.toFixed(2)} V) — charge it`); }
  else if (b != null && b < r.batt_warn_v) { level = Math.max(level, 1); notes.push(`battery getting low (${b.toFixed(2)} V)`); }
  if (missing) { level = Math.max(level, 1); notes.push(`${missing} probe(s) not reporting`); }
  if (r.uncal) { level = Math.max(level, 1); notes.push(`${r.uncal} unknown probe(s) on the bus`); }
  let text = `Last reading ${fmtAge(r.age_s)} ago`;
  if (r.stale) {
    level = 2;
    text = `No reading for ${fmtAge(r.age_s)} (expected within ${r.stale_minutes} min) — check the monitor`;
  }
  if (notes.length) text += " · " + notes.join(" · ");
  if (r.fw) text += ` · firmware ${r.fw}`;
  const color = css(["--good", "--warning", "--critical"][level]);
  const icon = level ? "⚠" : "✓";
  status.innerHTML = `<span class="dot" style="background:${color}"></span><span>${icon} ${text}</span>`;
}

async function refresh() {
  try {
    const [latest, readings] = await Promise.all([
      fetch("/api/latest").then(r => r.json()),
      fetch(`/api/readings?hours=${hours}`).then(r => r.json()),
    ]);
    showLatest(latest);
    draw(readings);
  } catch (e) {
    document.getElementById("status").textContent = "Can't reach the Pi: " + e;
  }
}

document.querySelectorAll(".controls button").forEach(b => b.addEventListener("click", () => {
  hours = Number(b.dataset.hours);
  document.querySelectorAll(".controls button").forEach(x => x.setAttribute("aria-pressed", x === b));
  refresh();
}));

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
